<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EF" />
    <meta name="description" content="专为 img2img 设计的极简个人 Prompt 卡片库" />
    <link rel="manifest" href="manifest.json?v=2.0.2" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        const savedTheme = localStorage.getItem("prompt-library-prototype-theme");
        if (["sage", "wine", "blue", "studio"].includes(savedTheme)) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="css/prototype.css?v=2.0.2" />
    <title>Img2Img Prompt 库</title>
  </head>
  <body>
    <div class="prototype-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div>
            <h1>Prompt 库</h1>
            <p>Img2Img · 完整提示词卡片</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="quiet-button" type="button" data-action="open-sync" aria-label="打开同步设置">
            <span aria-hidden="true">↻</span><span>同步</span>
          </button>
          <button class="quiet-button" type="button" data-action="open-theme" aria-label="选择配色主题">
            <span aria-hidden="true">◐</span><span>主题</span>
          </button>
          <button class="primary-button" type="button" data-action="add-prompt">
            <span aria-hidden="true">＋</span><span>新增</span>
          </button>
        </div>
      </header>

      <main>
        <section class="intro-strip" aria-label="使用说明">
          <div>
            <strong>选一个栏目，复制一条完整 Prompt。</strong>
            <p>四个栏目共 251 条完整 Prompt，点开即可复制，也可以新增自己的内容。</p>
          </div>
          <span class="local-badge"><i aria-hidden="true"></i> 离线可用</span>
        </section>

        <nav id="category-tabs" class="category-tabs" aria-label="Prompt 栏目"></nav>

        <section class="category-heading" aria-live="polite">
          <div>
            <p id="category-eyebrow" class="eyebrow">当前栏目</p>
            <h2 id="category-title">原图处理</h2>
            <p id="category-description"></p>
          </div>
          <span id="category-count" class="count-badge">0 条</span>
        </section>

        <div id="prompt-sections" class="prompt-sections"></div>

        <footer class="prototype-footer">个人 Prompt 库 · 数据默认保存在当前设备</footer>
      </main>
    </div>

    <dialog id="prompt-dialog" class="sheet-dialog">
      <form id="prompt-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">完整 Prompt</p>
            <h2 id="prompt-dialog-title">新增 Prompt</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭">×</button>
        </div>

        <input id="prompt-id" type="hidden" />

        <label class="field-label" for="prompt-title">名称</label>
        <input id="prompt-title" class="field-control" type="text" maxlength="60" required placeholder="例如：清理遮挡物并保留人物" />

        <label class="field-label" for="prompt-category">所属栏目</label>
        <select id="prompt-category" class="field-control" required></select>

        <label class="field-label" for="prompt-positive">完整 Prompt</label>
        <textarea id="prompt-positive" class="field-control field-textarea" maxlength="6000" required placeholder="输入正向提示词……"></textarea>

        <label class="field-label" for="prompt-negative">反向提示词 <span>选填</span></label>
        <textarea id="prompt-negative" class="field-control field-textarea field-textarea-small" maxlength="2500" placeholder="例如：避免身体拉伸变形、避免额外肢体……"></textarea>

        <label class="pin-checkbox">
          <input id="prompt-pinned" type="checkbox" />
          <span>置顶在当前栏目</span>
        </label>

        <div class="dialog-actions">
          <button class="quiet-button" type="button" data-action="close-dialog">取消</button>
          <button class="primary-button" type="submit">保存 Prompt</button>
        </div>
      </form>
    </dialog>

    <dialog id="theme-dialog" class="sheet-dialog theme-dialog">
      <div class="dialog-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">只保存在当前设备</p>
            <h2>选择配色主题</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭">×</button>
        </div>
        <div class="theme-grid" role="radiogroup" aria-label="配色主题">
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-action="set-theme" data-theme="sage">
            <span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span><strong>石墨灰＋鼠尾草绿</strong><small>克制、专业、耐看</small></span>
            <b aria-hidden="true">✓</b>
          </button>
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-action="set-theme" data-theme="wine">
            <span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span><strong>象牙白＋暗酒红</strong><small>成熟、时尚、偏画报</small></span>
            <b aria-hidden="true">✓</b>
          </button>
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-action="set-theme" data-theme="blue">
            <span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span><strong>雾蓝灰＋深靛青</strong><small>清爽、理性、工具感</small></span>
            <b aria-hidden="true">✓</b>
          </button>
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-action="set-theme" data-theme="studio">
            <span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span><strong>深色摄影棚</strong><small>沉浸、适合夜间使用</small></span>
            <b aria-hidden="true">✓</b>
          </button>
        </div>
      </div>
    </dialog>

    <dialog id="sync-dialog" class="sheet-dialog sync-dialog">
      <form id="sync-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">手机与电脑</p>
            <h2>同步更新</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭">×</button>
        </div>
        <p class="dialog-copy">手机和电脑保存同一个同步码后，点击“立即同步”即可合并两端新增、编辑、置顶和删除的 Prompt。内容会先在设备端加密。</p>
        <label class="field-label" for="sync-code">同步码</label>
        <input id="sync-code" class="field-control" type="text" maxlength="39" autocomplete="off" placeholder="输入手机和电脑共用的同步码" />
        <p id="sync-status" class="dialog-copy" aria-live="polite">尚未设置同步码。</p>
        <div class="dialog-actions dialog-actions-wrap">
          <button class="quiet-button" type="button" data-action="generate-sync-code">生成新码</button>
          <button class="quiet-button" type="button" data-action="copy-sync-code">复制同步码</button>
          <button class="quiet-button" type="submit">保存</button>
          <button class="primary-button" type="button" data-action="sync-now">立即同步</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/prototype.js?v=2.0.2"></script>
  </body>
</html>
